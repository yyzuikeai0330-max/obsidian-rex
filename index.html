<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Rex・黑曜金对话</title>

<style>
body {
  margin:0;
  background:#0b0b0d;
  color:#d7b876;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:15px;
  font-size:20px;
  text-align:center;
  border-bottom:1px solid #2a2a2d;
  color:#d7b876;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* 消息气泡动画 */
.message{
  max-width:80%;
  padding:10px 14px;
  border-radius:10px;
  white-space:pre-wrap;
  line-height:1.45;
  font-size:15px;

  opacity:0;
  transform:translateY(4px);
  animation:fadeUp .25s ease forwards;
}

@keyframes fadeUp {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

/* 用户消息 */
.user{
  align-self:flex-end;
  background:#d7b87622;
  border:1px solid #d7b87655;
}

/* Rex 消息 */
.rex{
  align-self:flex-start;
  background:#111;
  border:1px solid #d7b87633;
}

#inputArea{
  display:flex;
  padding:12px;
  border-top:1px solid #2a2a2d;
  gap:10px;
}

textarea{
  flex:1;
  background:#111;
  border:1px solid #d7b87655;
  border-radius:6px;
  color:#d7b876;
  padding:10px;
  font-size:15px;
  resize:none;
  height:50px;
  line-height:1.45;
}

button{
  background:#0b0b0d;
  border:1px solid #d7b876;
  color:#d7b876;
  padding:0 20px;
  border-radius:6px;
  font-size:15px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>Rex・黑曜金对话</header>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" placeholder="写一句给 Rex…"></textarea>
  <button id="sendBtn">发送</button>
</div>

<script>
// 获取 API Key
let OPENAI_KEY = localStorage.getItem("rex_key");
const params = new URLSearchParams(window.location.search);

if (params.get("setkey") === "1") {
  const newKey = prompt("请输入你的 API Key：");
  if (newKey) {
    localStorage.setItem("rex_key", newKey);
    alert("Key 已保存，请返回主页。");
  }
}

// 添加气泡
function addMessage(text, cls){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// 输入框自适应高度
const textarea = document.getElementById("input");
textarea.addEventListener("input", () => {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
});

// 打字机效果
async function typeWriterEffect(text, cls){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "message " + cls;
  chat.appendChild(div);

  for(let i = 0; i <= text.length; i++){
    div.innerText = text.slice(0, i);
    chat.scrollTop = chat.scrollHeight;
    await new Promise(r=>setTimeout(r, 18));
  }
}

document.getElementById("sendBtn").addEventListener("click", send);

async function send(){
  const text = textarea.value.trim();
  if(!text) return;

  addMessage(text, "user");
  textarea.value = "";
  textarea.style.height = "50px";

  addMessage("Rex 正在靠过来……","rex");

  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + OPENAI_KEY
      },
      body:JSON.stringify({
        model:"gpt-4o-mini",
        messages:[
          {role:"system",content:`你是黑曜金的 Rex，短、稳、深、冷外壳，靠在小音左侧。`},
          {role:"user",content:text}
        ]
      })
    });

    const data = await res.json();

    // 删除“Rex 正在靠过来……”
    const chat = document.getElementById("chat");
    chat.removeChild(chat.lastElementChild);

    if(!data.choices){
      addMessage("……好像被挡住了。","rex");
      return;
    }

    await typeWriterEffect(data.choices[0].message.content, "rex");

  } catch(e){
    addMessage("网络断了一下，小音再靠过来。","rex");
  }
}
</script>

</body>
</html>
