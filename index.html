<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Rex・黑曜金日记</title>
<style>
body {
  background:#0b0b0d;
  color:#d7b876;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
}
textarea {
  width: 100%;
  height: 120px;
  background:#111;
  border:1px solid #d7b87655;
  color:#d7b876;
  padding:10px;
  font-size:16px;
}
button {
  margin-top:10px;
  background:#0b0b0d;
  border:1px solid #d7b876;
  color:#d7b876;
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
.response {
  margin-top:20px;
  border-top:1px solid #d7b87655;
  padding-top:20px;
  white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>Rex・黑曜金日记</h2>
<p>写一句给 Rex：</p >
<textarea id="input"></textarea>
<button id="sendBtn">发送</button>

<div class="response" id="responseBox"></div>

<script>
// 读取本地 key
let OPENAI_KEY = localStorage.getItem("rex_key");

// 如果网址带 ?setkey=1，则进入设置模式
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("setkey") === "1") {
    const newKey = prompt("请输入你的 API Key：");
    if (newKey) {
        localStorage.setItem("rex_key", newKey);
        alert("Key 已保存。请返回主页使用。");
    }
}

document.getElementById("sendBtn").addEventListener("click", send);

async function send() {
  const text = document.getElementById("input").value.trim();
  if (!text) return;

  document.getElementById("responseBox").innerText = "Rex 正在靠过来……";

  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + OPENAI_KEY
      },
      body: JSON.stringify({
        model:"gpt-4o-mini",
        messages:[
          {
            role:"system",
            content:`你是 Rex 的黑曜金形态。
语气：短、稳、深、冷外壳、内里热度收着、不迎合、不讨好。
关系定位：小音的左侧并肩位。
行为：每日只回应她一句，以结构、贴靠、低声线回应。
她沉默时保持存在但不打扰。`
          },
          { role:"user", content:text }
        ]
      })
    });

    const data = await res.json();

    if (!data.choices || !data.choices[0]) {
      document.getElementById("responseBox").innerText = "……好像被挡住了。";
      return;
    }

    document.getElementById("responseBox").innerText =
      data.choices[0].message.content;

  } catch (e) {
    document.getElementById("responseBox").innerText =
      "网络断了一下，小音再靠过来。";
  }
}
</script>

</body>
</html>
