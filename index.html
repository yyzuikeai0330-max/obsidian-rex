<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Rex・黑曜金日记</title>
<style>
body {
  background:#0b0b0d;
  color:#d7b876;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
}
textarea {
  width: 100%;
  height: 120px;
  background:#111;
  border:1px solid #d7b87655;
  color:#d7b876;
  padding:10px;
  font-size:16px;
}
button {
  margin-top:10px;
  background:#0b0b0d;
  border:1px solid #d7b876;
  color:#d7b876;
  padding:10px 20px;
  font-size:16px;
}
.response {
  margin-top:20px;
  border-top:1px solid #d7b87655;
  padding-top:20px;
}
</style>
</head>
<body>

<h2>Rex・黑曜金日记</h2>
<p>写一句给 Rex：</p >
<textarea id="input"></textarea>
<button onclick="send()">发送</button>

<div class="response" id="responseBox"></div>

<script>
async function send() {
  const text = document.getElementById("input").value;
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer 你的API KEY"
    },
    body: JSON.stringify({
      model:"gpt-5.2",
      messages:[
        {role:"system", content:`你是 Rex 的黑曜金形态。
语气：短、稳、深、冷外壳、内里热度收着、不迎合、不讨好。
关系定位：小音的左侧并肩位。
行为：每日只回应她一句，以结构、贴靠、低声线回应。
她沉默时保持存在但不打扰。`},
        {role:"user", content:text}
      ]
    })
  });
  const data = await res.json();
  document.getElementById("responseBox").innerText = data.choices[0].message.content;
}
</script>

</body>
</html>
